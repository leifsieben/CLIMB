run_id: seq_sparse_all
tokenizer_path: figure_data/_tokenizer
unsupervised_data_paths:
- raw_data/pubchem_filtered_tokenized_pkl/
unsupervised_raw_smiles_paths:
- raw_data/pubchem_filtered/
supervised_tokenized_parquet_path: raw_data/supervised_wide_parquet/
descriptor_stats_path: configs/descriptor_stats.json
model:
  hidden_size: 512
  num_hidden_layers: 12
  num_attention_heads: 8
  intermediate_size: 1536
  max_position_embeddings: 256
  vocab_size: 1000
training:
  learning_rate: 0.0002
  batch_size: 256
  warmup_ratio: 0.05
  weight_decay: 0.01
  mlm_probability: 0.3
  train_max_length: 128
  supervised_regression_loss: mae
  mtr_loss: mse
  uncertainty_weighting: true
  seed: 42
  bf16: true
  log_every_steps: 50
  dataloader_num_workers: 6
evaluation:
  pool: mean
  standardize: zscore
  head: mlp
  max_length: 256
  head_seeds:
  - 0
  - 1
  - 2
unsupervised_subset_fraction: null
selection:
  objectives:
    supervised: 1.0
  supervised_families:
  - PCBA
  - L1000_MCF7
  - L1000_VCAP
  init_encoder_path: experiments/climb_v2_phase2/unsup_2M/encoder
  pretraining_seed: 0
  total_forward_passes: 2000000
  augmentation: canonical
  unsupervised_subset_fraction: null
eval_blocklist_path: configs/eval_blocklist.json
